name: Bug Report
description: Something isn't working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in as much detail as you can — the more context you give, the faster it gets fixed.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I do X, Y happens instead of Z."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this reliably?
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened?
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: How are you running Eyeris?
      options:
        - Docker (docker-start.sh)
        - Unraid (Community Applications / template)
        - Developer / manual (start.sh)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Eyeris version
      description: Found on the Settings page or in the Docker tag.
      placeholder: "e.g. v1.2.0 or latest"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant backend logs here. Run `docker logs eyeris` or check the Unraid container log.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, browser console errors, NAS setup details — anything that might help.
